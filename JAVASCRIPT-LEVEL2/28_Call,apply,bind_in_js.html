<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Call, Apply, Bind</title>
</head>
<body>
  <script>
    var salary = 20000;   // Global variable (also becomes a property of window in browsers)

    function getsalary(){
      // 'this.salary' depends on how function is called
      console.log(this.salary);   // Refers to 'salary' property of the current object (or window if called normally)
      console.log(window.salary); // Explicitly refers to global salary (20000)
      console.log(salary);        // Refers to global variable salary (20000)
    }

    // -----------------------------------------------
    // call, apply, bind examples
    // -----------------------------------------------

    function salaryinfo(a,b){
      // 'this' will refer to the object we explicitly provide using call/apply/bind
      console.log(this.name);  // Reads 'name' from the object
      console.log(this.age);   // Reads 'age' from the object (could be undefined if not present)
      // a and b are extra arguments (not used in this function now)
    }

    // Two objects
    employee = {
      name : "Dhanu",
      age : 19
    }
    employee2 = {
      name : "Naveen"
    }

    // -------------------------
    // CALL
    // -------------------------
    // call(object, arg1, arg2, ...)
    // Passes 'this' = object, arguments are given one by one
    salaryinfo.call(employee, 67, 66);  
    // Output: "Dhanu", 19  (arguments 67,66 are ignored since function doesn’t use them)

    salaryinfo.call(employee2);  
    // Output: "Naveen", undefined  
    // Because 'employee2' has no 'age' property → undefined

    // -------------------------
    // APPLY
    // -------------------------
    // apply(object, [arg1, arg2, ...])
    // Similar to call, but arguments must be passed as an array
    salaryinfo.apply(employee, [10,20]);  
    // Output: "Dhanu", 19

    // -------------------------
    // BIND
    // -------------------------
    // bind(object, arg1, arg2, ...)
    // Does NOT call function immediately
    // Returns a new function with 'this' fixed (bound) to object
    var f1 = salaryinfo.bind(employee, 10, 20);
    f1();  
    // Output: "Dhanu", 19
    // (arguments 10,20 are ignored, but they are still preset inside f1)
  </script>
</body>
</html>
