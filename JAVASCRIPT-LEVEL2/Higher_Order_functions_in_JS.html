<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Higher Order Functions</title>
</head>
<body>
  <script>
    // ============================================================
    // 🔹 What is a Higher Order Function (HOF)?
    // ------------------------------------------------------------
    // 👉 A function is called "Higher Order" if:
    // 1. It takes another function as an argument (callback), OR
    // 2. It returns a function.
    // ============================================================

    let arr = [1,2,3,4,5,6,7,8];
  
    // ------------------------------------------------------------
    // Example 1: Normal functions to calculate squares and cubes
    // ------------------------------------------------------------
    function squares(arr){
      let squaresArr = [];
      for (let ele of arr){
        squaresArr.push(ele * ele);
      }
      console.log("Squares:", squaresArr); // [1, 4, 9, 16, 25, 36, 49, 64]
    }

    function cubes(arr){
      let cubesArr = [];
      for (let ele of arr){
        cubesArr.push(ele * ele * ele);
      }
      console.log("Cubes:", cubesArr); // [1, 8, 27, 64, 125, 216, 343, 512]
    }

    squares(arr);
    cubes(arr);

    // ------------------------------------------------------------
    // Example 2: Using a Higher Order Function
    // ------------------------------------------------------------
    // Instead of writing separate 'squares' and 'cubes',
    // we can pass different "operations" as callbacks.
    function higherOrderFunction(arr, operation) {
      let result = [];
      for (let i = 0; i < arr.length; i++) {
        result.push(operation(arr[i])); // Apply callback on each element
      }
      return result;
    }

    // Callback functions
    function square(x) { return x * x; }
    function cube(x) { return x * x * x; }

    console.log("Squares via HOF:", higherOrderFunction(arr, square));
    console.log("Cubes via HOF:", higherOrderFunction(arr, cube));

    // ------------------------------------------------------------
    // Example 3: HOF that returns cumulative sum results
    // ------------------------------------------------------------
    function cumulativeSum(arr) {
      let result = [];
      let sum = 0;
      for (let i = 0; i < arr.length; i++) {
        sum += arr[i];
        result.push(sum); // store running total
      }
      return result;
    }

    let arr1 = [1,2,2,3,3,4,5,5,6];
    console.log("Cumulative Sum:", cumulativeSum(arr1));
    // Output: [1, 3, 5, 8, 11, 15, 20, 25, 31]

    // ------------------------------------------------------------
    // Example 4: HOF Returning a Function
    // ------------------------------------------------------------
    function first(){
      return () => {
        console.log("This is first function");
        second(); // call another function
      };
    }

    function second(){
      console.log("This is second function");
    }

    // first() returns a function → () calls it immediately
    first()();  
    // Output:
    // This is first function
    // This is second function

    // ============================================================
    // 🔹 Key Takeaways:
    // ------------------------------------------------------------
    // - A Higher Order Function (HOF) can:
    //   1. Take a function as input (callbacks).
    //   2. Return a function as output.
    //
    // - Benefits:
    //   ✔️ Makes code reusable
    //   ✔️ Avoids repetition
    //   ✔️ Helps in async programming (e.g., setTimeout, map, filter, reduce)
    //
    // - Real-world Examples: setTimeout, Array.map(), Array.filter(), Array.reduce()
    // ============================================================
  </script>
</body>
</html>
