
<!-- 📒 DOM Manipulation Notes
1. Selecting Elements

By ID → Used to select a single element with a unique identifier.

By Class → Selects all elements with a specific class name (returns an HTMLCollection).

By Tag Name → Selects all elements of a given tag (returns an HTMLCollection).

By Query Selector → Selects the first element that matches a CSS selector.

By Query Selector All → Selects all elements that match a CSS selector (returns a NodeList).

2. Modifying Elements

Change Content → You can modify the text or HTML inside an element.

Change Style → You can update the CSS styles (like color, font size, etc.) of an element.

3. DOM Properties

document → Represents the whole HTML document.

head → Refers to the <head> section of the HTML.

body → Refers to the <body> section of the HTML.

title → Shows the title of the webpage.

URL → Displays the current page URL.

characterSet → Defines the character encoding (like UTF-8).

images → Collection of all image elements in the document.

forms → Collection of all form elements in the document.

4. Key Differences

HTMLCollection → Returned by getElementsByClassName and getElementsByTagName. It is live, meaning it updates automatically if the document changes.

NodeList → Returned by querySelectorAll. It is static, meaning it does not update automatically. -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Manipulation</title>
</head>
<body>
    <div>
        <h1 id = "firstheading">this is first heading tag</h1>
        <h2 id="secondheading">this is second heading tag</h2>
        <p id="firstpara">this is a paragraph</p>

        <h3 class="classheading">this is class heading</h3>
        <p class="classpara1">this is class paragraph</p>
        <p class="classpara1">this is another class paragraph</p>
    </div>

    <script>
        // Log the element with id "firstheading" to the console using getElementById
        console.log(document.getElementById("firstheading")); 

        // Change the inner HTML (content) of the element to new text
        document.getElementById("firstheading").innerHTML = "this is modified text by using innerHtml"; // modification by using innerHTML

        // Change the text color of the element to red
        document.getElementById("firstheading").style.color = "red";

        // Log all elements with the class name "heading" to the console
        console.log(document.getElementsByClassName("classheading")); // using getElementsByClassName // returns HTMLCollection
        document.getElementsByClassName("classheading")[0].style.color = "blue"; // modifying the first element in the HTMLCollection
        document.getElementsByClassName("classheading")[0].innerHTML = "this is modified text by using innerHtml for class";  


        // log all elements with the tagname "p" to the console
        console.log(document.getElementsByTagName("p")); // using getElementsByTagName // returns HTMLCollection
        document.getElementsByTagName("p")[0].style.color = "green"; // modifying the first element in the HTMLCollection
        document.getElementsByTagName("p")[0].innerHTML = "this is modified text by using innerHtml for tagname";

        //log all elements with the querySelector
        // same class name for multiple tags it will return the first class name 
        console.log(document.querySelector(".classpara1")); // using querySelector // returns the first element
        document.querySelector(".classpara1").style.color = "purple"; // modifying the first element
        document.querySelector(".classpara1").innerHTML = "this is modified text by using innerHtml for querySelector";

        // log all elements with the querySelectorAll
        console.log(document.querySelectorAll(".classpara1")); // using querySelectorAll // returns NodeList
        document.querySelectorAll(".classpara1")[0].style.color = "orange"; // modifying the first (and only) element in the NodeList
        document.querySelectorAll(".classpara1")[0].innerHTML = "this is modified text by using innerHtml for querySelectorAll";


        // DOM properties to select html element
        console.log(document);
        console.log(document.head); // head element
        console.log(document.body); // body element
        console.log(document.innerHTML); // entire HTML content
        console.log(document.title); // title of the document
        console.log(document.URL); // URL of the document
        console.log(document.characterSet); // character set of the document
        console.log(document.images); // returns HTMLCollection of images
        console.log(document.forms); // returns HTMLCollection of forms


    </script>
</body>
</html>
