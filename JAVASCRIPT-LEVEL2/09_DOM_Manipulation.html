<!-- DOM (Document Object Model) in JavaScript

When a web page loads, the browser creates a tree-like structure of the HTML called the DOM.

Each HTML element is a node in this tree, with parent and child relationships.

The root of this tree is the document.

Using JavaScript, we can access, change, remove, or create elements anywhere in the DOM.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom Manipulation</title>
</head>
<body>
    <h1 id = "first">Dom Manipulation getElementById</h1>
    <div class = "second">Dom Manipulation getElementByClassName</div>
    <p id = "id1">this is paragraph tag with id-1</p>
    <p id = "id2">this is paragraph tag with id-2</p>
    <script>
        /* document.getElementById*/
        let id = document.getElementById("first");
        console.log(id); // output: <h1 id="first">Dom Manipulation heading</h1>
        // console.log(an); // output: undefined (because 'an' is not defined)

        /* document.getElementByClass*/
        let className = document.getElementsByClassName("second");
        console.log(className); // output: HTMLCollection(1) [h2.second]
        // expand div imp tags are
        // innerHTML: "Dom Manipulation getElementByClassName"
        // innerText: "Dom Manipulation getElementByClassName"

        /* document.getElementByTagname*/
        let tagName = document.getElementsByTagName("div");
        console.log(tagName); // output: HTMLCollection(1) [div.second]

        /* document.querySelector(. / # / tagname) */
        let querySelector = document.querySelector(".second");
        console.log(querySelector); // output: <div class="second">Dom Manipulation getElementByClassName</div>

        /* document.querySelectorAll*/
        let id1 = document.querySelectorAll("#id1,#id2");
        console.log(id1); //output: NodeList(2) [p#id1, p#id2]
    </script>
</body>
</html>


<!-- DOM PROPERTIES TO SELECT HTML ELEMENTS -->
<!-- document.body → <body> content

document.head → <head> content

document.title → <title> text

document.anchors → <a> with name attribute

document.forms → All <form> elements

document.images → All <img> elements

document.scripts → All <script> elements -->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="author" content="Default Author">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Object Demo</title>
</head>
<body>
  <h1>Document Object Practice</h1>

  <!-- Anchors -->
  <a name="section1">Section 1 (Anchor)</a><br>
  <a href="https://example.com" target="_blank">Go to Example.com</a>
  <hr>

  <!-- Form -->
  <form name="loginForm">
    <label>Username: <input type="text" name="username"></label>
    <input type="submit" value="Login">
  </form>
  <hr>

  <!-- Images -->
  <img src="pic1.jpg" alt="Picture 1">
  <img src="pic2.jpg" alt="Picture 2">
  <hr>

  <!-- External JS (main.js file assumed if you want extra scripts) -->
  <script src="main.js"></script>

  <!-- Inline Script -->
  <script>
    // === Document Body ===
    console.log("Body:", document.body);
    document.body.style.backgroundColor = "lightblue"; // Change background color

    // === Document Head ===
    console.log("Head:", document.head);
    // Add meta tag dynamically:
    document.head.innerHTML += '<meta name="author" content="Dhanush">';
    
    console.log("Page Title (Before):", document.title);
    document.title = "New Page Title"; // Change title
    console.log("Page Title (After):", document.title);

    // === Document Anchors ===
    console.log("Anchors:", document.anchors); // Only anchors with name attribute

    // === Document Forms ===
    console.log("First Form:", document.forms[0]); // Access first form
    console.log("Form by name:", document.forms["loginForm"]); // Access form by name

    // === Document Images ===
    console.log("Number of Images:", document.images.length);
    document.images.src = "newpic.jpg"; // Change first image src

    // === Document Scripts ===
    console.log("Scripts on Page:", document.scripts); // Logs all <script> tags
  </script>
</body>
</html>
