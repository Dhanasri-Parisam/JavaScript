<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch API in JS</title>
</head>

<body>
  <h1>Fetch API in JavaScript</h1>
  <p>The Fetch API provides a modern way to make network requests and handle responses in JavaScript.</p>

  <h2>Basic Usage</h2>

  <script>
    /*
    ===============================================
     FETCH API - COMPLETE NOTES
    ===============================================

     What is Fetch API?
       - A modern way to make HTTP requests in JavaScript.
       - Replaces older methods like XMLHttpRequest.
       - Returns a Promise.

     Syntax:
       fetch(url, [options])

       - url      → API endpoint / resource you want to fetch
       - options  → optional object to specify method, headers, body etc.

     Common HTTP Methods:
       - GET    → Fetch/retrieve data (default method if not specified)
       - POST   → Send new data to the server
       - PUT    → Replace/update entire resource
       - PATCH  → Update only some fields in resource
       - DELETE → Remove a resource

     fetch() returns a Promise:
       - .then() → handles success
       - .catch() → handles errors
    */


    // ============================================================
    // Example 1: Basic GET Request (fetching country data)
    // ============================================================
    let promise = fetch('https://restcountries.com/v3.1/name/india');
    promise
      .then(function (response) {
        console.log(response); // Response object (metadata like status, headers)
        return response.json(); // Convert response to JSON format
      })
      .then(function (data) {
        console.log(data); // Actual JSON data from API
      })
      .catch(function (err) {
        console.log(err); // Handles network or parsing errors
        console.log("Error in fetching data");
      });


    // ============================================================
    // Example 2: Simple GET Request from placeholder API
    // ============================================================
    fetch('https://jsonplaceholder.typicode.com/posts/1')
      .then((response) => response.json()) // Convert to JSON
      .then((json) => console.log(json));  // Log the object


    // ============================================================
    // Example 3: GET multiple posts
    // ============================================================
    fetch('https://jsonplaceholder.typicode.com/posts')
      .then((response) => response.json())
      .then((json) => console.log(json));


    // ============================================================
    // Example 4: POST request (create new resource)
    // ============================================================
    fetch('https://jsonplaceholder.typicode.com/posts', {
      method: 'POST', // HTTP method
      body: JSON.stringify({  // Body must be in stringified JSON
        title: 'Dhanu',
        body: 'I am learning JS',
        password: 123
      }),
      headers: {
        'content-type': 'application/json; charset=UTF-8', // Header to tell server about data format
      },
    })
      .then((response) => response.json())
      .then((json) => console.log(json));


    // ============================================================
    // Example 5: PUT request (update/replace entire resource)
    // ============================================================
    fetch('https://jsonplaceholder.typicode.com/posts/1', {
      method: 'PUT',
      body: JSON.stringify({
        id: 1,       // Must send ID (since replacing full object)
        number: 123,
        name: 'tokyo',
        age: 22
      }),
      headers: {
        'content-type': 'application/json; charset=UTF-8',
      },
    })
      .then((response) => response.json())
      .then((json) => console.log(json));


    // ============================================================
    // Example 6: PATCH request (update only selected fields)
    // ============================================================
    fetch('https://jsonplaceholder.typicode.com/posts/1', {
      method: 'PATCH',
      body: JSON.stringify({
        age: 22 // Only updating "age", other fields remain unchanged
      }),
      headers: {
        'content-type': 'application/json; charset=UTF-8',
      },
    })
      .then((response) => response.json())
      .then((json) => console.log(json));


    // ============================================================
    // Example 7: DELETE request (removes a resource)
    // ============================================================
    fetch('https://jsonplaceholder.typicode.com/posts/1', {
      method: 'DELETE',
    });


    // ============================================================
    // Example 8: GET request with Query Parameters
    // (fetch all posts from a specific user)
    // ============================================================
    fetch('https://jsonplaceholder.typicode.com/posts?userId=1')
      .then((response) => response.json())
      .then((json) => console.log(json));


    // ============================================================
    // Example 9: GET related data (nested route)
    // (fetch all comments for a specific post)
    // Equivalent to: /comments?postId=1
    // ============================================================
    fetch('https://jsonplaceholder.typicode.com/posts/1/comments')
      .then((response) => response.json())
      .then((json) => console.log(json));

    /*
        // conclusion
        console.log(response) shows the Response object (metadata like status, headers, body stream) → not the actual data.
        response.json() converts that body into usable JavaScript objects/arrays.
        API can return:
        Array(n) → multiple items (list of objects).
        Object {…} → a single resource.
        [[Prototype]] is just Chrome’s way of showing inheritance, not actual data.
    */

  </script>
</body>

</html>
