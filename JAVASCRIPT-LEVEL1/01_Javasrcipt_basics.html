    <h2>Enter "add" to add a new task</h2>
    <h3>Enter "remove" to remove a task</h3>
    <h4>Enter "exit" to exit the program</h4>

    // basic todo list using loops & conditions
    let todo = [];
    console.log("--------------------");

    while (true) {
        const option = prompt("Choose an option: add, remove, list, quit");

        if (option === "add") {
            let item = prompt("Enter the item to add:");
            todo.push(item);
            console.log(`item Added: ${item}`);
        }

        else if (option === "remove") {
            if (todo.length === 0) {
                console.log(" No items to remove.");
            } else {
                console.log("Current todo list:");
                for (let i = 0; i < todo.length; i++) {
                    console.log(`${i}: ${todo[i]}`);
                }
                let index = parseInt(prompt("Enter the index to delete:"), 10);
                if (!isNaN(index) && index >= 0 && index < todo.length) {
                    let removed = todo.splice(index, 1);
                    console.log(`Removed: ${removed[0]}`);
                } else {
                    console.log("Invalid index.");
                }
            }
        }

        else if (option === "list") {
            if (todo.length === 0) {
                console.log("No items in your todo list.");
            } else {
                console.log("Your todo list:");
                for (let i = 0; i < todo.length; i++) {
                    console.log(`${i}: ${todo[i]}`);
                }
            }
        }

        else if (option === "quit") {
            console.log("You quit the program.");
            if (todo.length > 0) {
                console.log("Final todo list:");
                for (let i = 0; i < todo.length; i++) {
                    console.log(`${i}: ${todo[i]}`);
                }
            } else {
                console.log("No items in your todo list.");
            }
            alert("You have exited the program.");
            break;
        }

        else {
            console.log("Invalid option. Please type add, remove, list, or quit.");
        }
    }
    console.log("---------------------");
    </script>
